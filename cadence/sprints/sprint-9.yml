sprint:
  name: "Sprint 9"
  number: 9
  goal: "Ship the Frontend GUI Quality & Consistency Pass -- fix the app-shell layout regression and audit/polish every screen against ui-ux-pro-max and Ant Design standards, closing out C-28"
  started: 2026-07-15
  ends: 2026-07-29
  status: completed
items:
  - id: C-29
    title: "App Shell Regression Fix"
    type: story
    parent: C-28
    status: done
    points: 2
    assignee: claude
    carryovers: 0
    notes: "work pass 1: Removed dead Vite-starter CSS from App.css (kept only .app__session), replaced <main id=\"center\"> (which had place-items:center forcing shrink-to-fit on every routed page) with <main className=\"app__main\"> (flex:1, no align-items override). Removed #root's landing-page width:1126px/text-align:center/margin:auto constraint from index.css; moved text-align:center into Login.css since Login implicitly depended on #root's text-align. Added App.test.tsx regression tests (verified they fail against pre-fix code via git stash, then pass against the fix). 153/153 frontend tests passing, tsc -b clean, oxlint clean."

  - id: C-30
    title: "Login Page UI Audit & Fixes"
    type: story
    parent: C-28
    status: done
    points: 2
    assignee: claude
    carryovers: 0
    notes: "work pass 1: Audited Login.tsx/Login.css against ui-ux-pro-max guidelines. One concrete finding fixed: inputs/submit button were antd default 'middle' size (~32px), below the 44px touch target minimum and inconsistent with the app's established size=\"large\" convention (OrderTaking, KitchenClockPad, KitchenDisplay) -- added size=\"large\" to Input/Input.Password/Button, with a regression test verified to fail pre-fix. All other audit areas checked and found already compliant (visible labels, password toggle, Alert role semantics, focus states, Ant Design tokens, spacing scale) -- documented with evidence in notes rather than invented busywork. 154/154 frontend tests passing, tsc -b clean, oxlint clean."

  - id: C-31
    title: "Owner Console UI Audit & Fixes"
    type: story
    parent: C-28
    status: done
    points: 5
    assignee: claude
    carryovers: 0
    notes: "work pass 1: Audited OwnerPage shell + all 4 sections against ui-ux-pro-max. Fixed: Sider collapse trigger had no accessible name/keyboard focus (was a bare div, now an explicit Button with aria-label); Menu Management/Employees/Analytics headings used raw <h2> inheriting leftover landing-page CSS instead of Typography.Title (now consistent with Table Layout/Login/Checkout/OrderTaking). Re-verified the epic's origin bug: Table Layout's Floor Plan heading/800x600 canvas render correctly post-C-29, with a new regression test. Checked and confirmed compliant: Alert roles, icon aria-labels, no emoji icons, no focus-ring overrides, status color+text pairing. Deferred with reasons: canvas delete/resize controls below 44px touch target (would require redesigning the floor-plan interaction model, not an audit fix); resize handle has no keyboard equivalent (new feature, not audit scope); Owner Console's compact/small controls vs. the app's size=\"large\" convention (deliberate admin-density pattern, not a deviation -- that convention is for frontline touch interactions). 159/159 frontend tests passing (2 runs, no flake), tsc -b clean, oxlint clean."

  - id: C-32
    title: "Cashier & Take-Orders UI Audit & Fixes"
    type: story
    parent: C-28
    status: done
    points: 4
    assignee: claude
    carryovers: 0
    notes: "work pass 1: Audited Checkout/CashierPage and OrderTaking/TakeOrdersPage against ui-ux-pro-max. Checkout fixed: added size=\"large\" to Confirm-payment button and payment-method Radio.Group (touch-target gap vs. established frontline convention); added loading/disabled state during checkout/cancel requests to prevent double-tap; wrapped Cancel order in a Popconfirm (previously fired immediately with no confirmation, mirroring EmployeeManager's Deactivate pattern). OrderTaking audited and found already fully compliant (size=\"large\" throughout, async loading/disabled state present, correct Alert role usage, Typography.Title headings, aria-labels on icon buttons) -- it was already the reference implementation cited by earlier tickets. Deferred: raw hex in OrderTaking.css judged consistent with the established neutral-border palette elsewhere, not an inconsistency. 162/162 frontend tests passing, tsc -b clean, oxlint clean."

  - id: C-33
    title: "Kitchen UI Audit & Fixes"
    type: story
    parent: C-28
    status: done
    points: 3
    assignee: claude
    carryovers: 0
    notes: "work pass 1: Audited KitchenDisplay/KitchenClockPad against ui-ux-pro-max, preserving the deliberate large-touch-target/at-a-distance-readability design intent. Fixed: Mark ready had no loading/disabled feedback -- added per-order pending state (mirroring C-32's Checkout pattern) so only the card actually submitting shows a spinner, deliberately NOT disabling other orders' buttons (unlike Checkout) since blocking the whole board during one in-flight request would hurt busy-kitchen speed. Verified already compliant: no raw <h2> reskinning trap, correct Alert role usage (this is the original reference implementation that pattern was drawn from), touch targets, no emoji icons, no focus-ring overrides, sequential heading hierarchy, color+text status pairing. Deliberately NOT added: confirmation dialog on Mark ready (advances workflow forward, not destructive like Cancel/Deactivate; a Popconfirm on every tap would fight the at-speed design intent) and aria-expanded on the clock-pad toggle (no established convention elsewhere in the app; would be inconsistent to add here alone). 163/163 frontend tests passing, tsc -b clean, oxlint clean."

  - id: C-34
    title: "Owner Console Session Bar Contrast & Sidebar Label Truncation"
    type: task
    status: done
    points: 2
    assignee: claude
    carryovers: 0
    added_mid_sprint: true
    notes: "work pass 1: Fixed session-bar contrast by giving .app__session an explicit theme.useToken() background (App.tsx SessionBar, matches SalesTrendChart's runtime-theme-color pattern) instead of relying on index.css's leftover dark-mode background bleed-through; left index.css's prefers-color-scheme block in place (shielding, not deleting -- confirmed via grep nothing else depends on it either way). Fixed sidebar truncation by giving OwnerPage's Layout.Sider an explicit width={230} (was antd's 200px default, sized for antd's 14px baseline vs. this app's fontSize:16 token); collapsedWidth untouched so collapsed behavior is unchanged. Added regression tests for both (App.test.tsx, OwnerPage.test.tsx). 167/167 frontend tests passing, tsc -b clean, oxlint clean."
