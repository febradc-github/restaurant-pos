items:
  - id: C-29
    title: "App Shell Regression Fix"
    type: story
    parent: C-28
    status: done
    points: 2
    assignee: claude
    carryovers: 0
    notes: "work pass 1: Removed dead Vite-starter CSS from App.css (kept only .app__session), replaced <main id=\"center\"> (which had place-items:center forcing shrink-to-fit on every routed page) with <main className=\"app__main\"> (flex:1, no align-items override). Removed #root's landing-page width:1126px/text-align:center/margin:auto constraint from index.css; moved text-align:center into Login.css since Login implicitly depended on #root's text-align. Added App.test.tsx regression tests (verified they fail against pre-fix code via git stash, then pass against the fix). 153/153 frontend tests passing, tsc -b clean, oxlint clean."

  - id: C-30
    title: "Login Page UI Audit & Fixes"
    type: story
    parent: C-28
    status: done
    points: 2
    assignee: claude
    carryovers: 0
    notes: "work pass 1: Audited Login.tsx/Login.css against ui-ux-pro-max guidelines. One concrete finding fixed: inputs/submit button were antd default 'middle' size (~32px), below the 44px touch target minimum and inconsistent with the app's established size=\"large\" convention (OrderTaking, KitchenClockPad, KitchenDisplay) -- added size=\"large\" to Input/Input.Password/Button, with a regression test verified to fail pre-fix. All other audit areas checked and found already compliant (visible labels, password toggle, Alert role semantics, focus states, Ant Design tokens, spacing scale) -- documented with evidence in notes rather than invented busywork. 154/154 frontend tests passing, tsc -b clean, oxlint clean."

