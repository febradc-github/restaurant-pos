items:
  - id: C-17
    title: "Cashier Page"
    type: story
    parent: C-14
    status: done
    points: 4
    assignee: claude
    carryovers: 0
    notes: "work pass 1: CashierPage.tsx (thin Layout/Content wrapper around rebuilt Checkout, mirrors OwnerPage naming), mounted at /cashier inside existing RoleRoute cashier gate (unchanged). Checkout fully rebuilt: Row/Col Card grid (one per open order), Radio.Group button-style payment method selector, full-width primary Confirm button + visually subordinate danger/text Cancel button below it, Tag+CheckCircleOutlined for Paid state, Alert type=warning (never error) for print-failure distinct from genuine errors. All API interaction points (list/checkout/cancel) and state tracking preserved exactly. 88/88 frontend tests passing (+4), typecheck/lint clean; App.test.tsx route-gating re-confirmed for /cashier. Gotchas for C-18/19: antd Radio.Button's native input has pointer-events:none (antd's own CSS) -- userEvent.click must target the visible label, not the role=radio element, or jsdom throws; antd v6 Space deprecated `direction` prop in favor of `orientation`."

  - id: C-18
    title: "Take-Orders Page"
    type: story
    parent: C-14
    status: done
    points: 4
    assignee: claude
    carryovers: 0
    notes: "work pass 1: TakeOrdersPage.tsx (thin Layout/Content wrapper around rebuilt OrderTaking, mirrors CashierPage). OrderTaking rebuilt: searchable large Select for table choice as first control, Card with +/-/InputNumber Space.Compact quantity stepper per menu item (large touch targets, - disabled at 0), full-width primary Button with loading state for Place order, Alert type=error for validation/fetch failures, Alert type=success role=status (explicit role override -- antd Alert hardcodes role=alert by default but spreads restProps after, so an explicit role prop wins) for the confirmation. All original behavior (fetch-on-mount no auth header, available-only filtering, quantity delete-on-zero, validation, ordersApi.create payload, reset-on-success) preserved byte-for-byte. Avoided antd List (deprecated in v6.5.1, emits runtime warning) in favor of a plain div grid. 91/91 frontend tests passing (+6 net), typecheck/lint clean; App.test.tsx route-gating re-confirmed for /take-orders. Notes for C-19: antd Select's non-aria DOM props (e.g. data-testid) land on the root wrapper not the portal dropdown, useful for scoping queries; broad regex getByLabelText matches are a trap when a stepper's +/- buttons share substrings with the input's own label (anchor with ^...$)."

