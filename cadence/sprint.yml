items:
  - id: C-11
    title: "Server & Cashier Login-Based Time Tracking"
    type: story
    parent: C-10
    status: done
    points: 5
    assignee: claude
    carryovers: 0
    notes: "work pass 1: backend time_entries migration/model/factory, added missing UserRole::Server case (enum only had Owner/Cashier), AuthController::login/logout hooked to create/close time_entries rows for Cashier+Server only (Owner excluded), TimeEntry scopeForUser/scopeForRole for querying, 126/126 backend tests passing (345 assertions), Pint clean. Frontend: Take-Orders page gated behind login same as Checkout, AuthRole extended with 'server', 65/65 frontend tests passing, typecheck+lint clean. KitchenDisplay left untouched (no-login, per C-12). Notes for later tickets: Kitchen still has no UserRole case/User rows (needed for C-12); role column on time_entries is a plain string snapshot so 'kitchen' fits without migration change; auto_closed already defaults false, ready for C-13's job to set true. Coder flagged PHP was not on PATH in this environment -- had to invoke a winget-installed php.exe directly by full path."

  - id: C-12
    title: "Kitchen PIN Clock-In/Out"
    type: story
    parent: C-10
    status: done
    points: 5
    assignee: claude
    carryovers: 0
    notes: "work pass 1: added missing UserRole::Kitchen case, users.pin migration (nullable unique string), UserFactory->kitchen(pin) state, User.pin marked Fillable+Hidden. New no-auth POST /api/kitchen/clock endpoint (KitchenClockController) toggling time_entries clock-in/clock-out by PIN lookup; malformed and unrecognized PINs both return the same generic 422 so PIN validity can't be enumerated. Frontend: KitchenClockPad numeric-entry overlay wired into KitchenDisplay as an additional element, order-fetch/WebSocket/mark-ready logic untouched (proven by coexistence + unmodified pre-existing KitchenDisplay tests). 135/135 backend tests passing (376 assertions), Pint clean; 73/73 frontend tests passing, typecheck+lint clean. Confirmed for C-13: both C-11's Sanctum-login flow and this PIN flow write to the same time_entries table, so a single `whereNull('clock_out')` query finds every forgotten clock-out regardless of origin; auto_closed remains untouched here, reserved for C-13's job."

