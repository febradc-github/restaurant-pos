  - id: C-36
    title: "App-Wide Dark Theme Foundation"
    type: story
    parent: C-35
    status: done
    points: 5
    assignee: claude
    carryovers: 0
    notes: "work pass 1: theme.ts switched to antd's darkAlgorithm with explicit dark tokens (colorBgLayout #000000, colorBgContainer #141414); colorPrimary nudged from #C2410C to #E55E10 (same terracotta hue) after a contrast script showed the original seed fell below WCAG's 3:1 UI-component floor against dark backgrounds -- #E55E10 hits ~4.1-4.7:1. index.css's OS-driven @media(prefers-color-scheme:dark) block removed entirely (app is now dark-only, not OS-conditional); its values became the base :root values. C-34's SessionBar inline background kept (still load-bearing -- shields against index.css's now-different --bg token). Two hardcoded-light-color regressions found and fixed: OwnerPage.css's Layout.Header white background (was sitting behind dark-theme text), TableLayoutEditor.css's table/delete-button text color (was inheriting the app's now-light ambient color, went light-on-light against their intentionally-still-light fixed backgrounds -- deferred properly to C-37's rebuild). New theme.test.ts asserts dark backgrounds, retained terracotta hue, and WCAG contrast ratios. 172 tests total, 170 passing; 2 MenuManager.test.tsx failures are pre-existing full-suite timing flakiness (confirmed: reproduces identically against pre-C-36 code via git stash, passes 10/10 in isolation both before and after this change) -- not a regression. tsc -b clean, oxlint clean. Noted for follow-up: App.test.tsx's `?raw` CSS-source imports resolve empty under this vitest config's `css:false`, silently defanging the C-29-era source-text assertions -- pre-existing, out of C-36's scope."

