sprint:
  name: "Sprint 8"
  number: 8
  goal: "Ship the Owner Analytics Dashboard -- sales, best/worst-sellers, attendance, and inventory restock -- closing out C-23 and the original digital-transformation goal"
  started: 2026-07-14
  ends: 2026-07-28
  status: active
items:
  - id: C-24
    title: "Sales & Best-Seller Analytics API"
    type: story
    parent: C-23
    status: done
    points: 5
    assignee: claude
    carryovers: 0
    notes: "work pass 1: Order gained scopePaid/scopePaidBetween chainable local scopes (mirroring TimeEntry's pattern) instead of raw SQL. New AnalyticsController: GET /api/analytics/sales (revenue grouped by day, Paid orders only, dated by paid_at) and GET /api/analytics/menu-items (quantity_sold + revenue per item, sorted revenue desc by default, both fields present for re-sorting), both owner-gated. Revenue computed as quantity*menu_item.price summed as floats then number_format(...,2) to a string, mirroring PrintAgentClient::payloadFor()'s existing precedent for order totals rather than introducing bcmath. 12/12 new analytics tests, 203/203 full backend suite passing (572 assertions), Pint clean. Response shapes for C-26: sales=[{date, revenue}] ascending by date; menu-items=[{menu_item_id, name, quantity_sold, revenue}] descending by revenue by default."

  - id: C-25
    title: "Inventory Threshold & Restock API"
    type: story
    parent: C-23
    status: done
    points: 6
    assignee: claude
    carryovers: 0
    notes: "work pass 1: threshold unsignedInteger column on inventory_items (default 0). New RestockController: index() returns combined live report per ingredient {id, name, stock, threshold, suggested_threshold, shortfall}, computed fresh per request (no caching/snapshot); suggested_threshold = ceil(trailing-30-day Paid-order consumption / 30), 0 for no history, non-Paid orders excluded (reuses Order::scopePaid from C-24). update() is a dedicated PATCH /api/inventory-items/{id}/threshold Owner-override endpoint, deliberately separate from the existing C-5 InventoryItemController (whose validation only accepts name/stock) so the override can't be smuggled through the general endpoint. 216/216 full backend suite passing (601 assertions, 13 new RestockTest cases), Pint clean. Response shapes for C-26 confirmed in notes."

